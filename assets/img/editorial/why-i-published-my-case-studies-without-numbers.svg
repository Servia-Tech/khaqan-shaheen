<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Make a number defensible</title><desc id="desc">Clear question → Comparable baseline → Defined time window → Repeatable method. Four stages, numbered in order.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#254157" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6cbcff"/></marker></defs><rect width="1200" height="600" rx="20" fill="#091522"/><rect width="1200" height="600" fill="url(#grid)" opacity=".5"/><path d="M500 160H690 M1100 160H1150V300H60V420H90 M500 420H690" fill="none" stroke="#6cbcff" stroke-width="3" stroke-dasharray="8 8" opacity=".7" marker-end="url(#arrow)"/><rect x="100" y="77" width="390" height="165" rx="20" fill="#102235" stroke="#6cbcff" stroke-opacity=".5"/><circle cx="163" cy="160" r="28" fill="#6cbcff"/><text x="163" y="170" text-anchor="middle" fill="#07121c" font-family="Arial,sans-serif" font-weight="700" font-size="30">1</text><text x="211" y="152" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">Clear question</text><rect x="700" y="77" width="390" height="165" rx="20" fill="#102235" stroke="#6cbcff" stroke-opacity=".5"/><circle cx="763" cy="160" r="28" fill="#6cbcff"/><text x="763" y="170" text-anchor="middle" fill="#07121c" font-family="Arial,sans-serif" font-weight="700" font-size="30">2</text><text x="811" y="152" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">Comparable</text><text x="811" y="190" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">baseline</text><rect x="100" y="337" width="390" height="165" rx="20" fill="#102235" stroke="#6cbcff" stroke-opacity=".5"/><circle cx="163" cy="420" r="28" fill="#6cbcff"/><text x="163" y="430" text-anchor="middle" fill="#07121c" font-family="Arial,sans-serif" font-weight="700" font-size="30">3</text><text x="211" y="412" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">Defined time</text><text x="211" y="450" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">window</text><rect x="700" y="337" width="390" height="165" rx="20" fill="#102235" stroke="#6cbcff" stroke-opacity=".5"/><circle cx="763" cy="420" r="28" fill="#6cbcff"/><text x="763" y="430" text-anchor="middle" fill="#07121c" font-family="Arial,sans-serif" font-weight="700" font-size="30">4</text><text x="811" y="412" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">Repeatable</text><text x="811" y="450" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="29">method</text><text x="600" y="579" text-anchor="middle" fill="#9eb3c9" font-family="Arial,sans-serif" font-size="20" letter-spacing="4">KHAQAN SHAHEEN / FIELD NOTES 18</text></svg>